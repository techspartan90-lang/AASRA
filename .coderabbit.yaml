# CodeRabbit review configuration for MANAS SURAKSHA
# yaml-language-server: $schema=https://coderabbit.ai/integrations/code-reviews.v2.json

language: "en-US"
tone_instructions: "Thorough, constructive, security-critical, and accessibility-conscious."
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  path_instructions:
    - path: "**/*"
      instructions: |
        MANAS SURAKSHA REVIEW CRITERIA:
        1. Privacy & Sensitive Data:
           - NEVER allow PII, mental health data, survivor case notes, or emergency contacts to be logged to console or telemetry.
           - NEVER persist raw voice check-in audio.
        2. Security:
           - Check authentication, authorization, Supabase RBAC and RLS.
           - Ensure no secrets, service-role keys, or credentials exist in client bundles or public endpoints.
        3. Design System & UX:
           - Check the luxury palette (#474747, #333333, #FD1053).
           - Reuse existing design-system primitives where applicable.
           - Verify day/night theme integrity without contrast or theme leakage.
        4. Accessibility (WCAG 2.1 AA):
           - Check contrast, keyboard focus, screen-reader labels, and minimum 44px touch targets.
           - Ensure 3D/canvas animation respects prefers-reduced-motion.
        5. TypeScript & React:
           - Strict typing, no unsafe any casts, correct hook dependencies, and no unnecessary re-renders.
        6. AI safety:
           - Treat model outputs as risk indicators/predictions, never as definitive clinical diagnoses.
           - Do not expose chain-of-thought or sensitive model reasoning.

    - path: "app/**/*"
      instructions: |
        Review Next.js server/client boundaries, API validation, authentication,
        authorization, error handling, and prevention of sensitive data exposure.

    - path: "components/**/*"
      instructions: |
        Review React state safety, accessibility, responsive behavior,
        theme integrity, reduced-motion behavior, and design-system consistency.

chat:
  auto_reply: true
